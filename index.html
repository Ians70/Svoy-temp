radius:12px;padding:12px 13px;background:#fff;color:var(--ink);min-height:46px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkline{display:flex;gap:10px;align-items:start;font-size:13px;padding:9px 0}.checkline input{accent-color:#728f42;width:18px;height:18px;margin:1px 0}.info-key{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:800;color:#779084;margin:17px 0 4px}.info-text{margin:0;font-size:14px}.illustration{height:138px;background:radial-gradient(circle at 50% 55%,#d9e8c9,#f5f9ed);border-radius:18px;display:flex;justify-content:center;align-items:center;margin:16px 0 5px;position:relative;overflow:hidden}.illustration span{font-size:62px}.illustration .sub{position:absolute;bottom:12px;font-weight:850;font-size:10px;letter-spacing:.1em;color:#718066}.workout-head{text-align:center;padding:12px 0 18px}.workout-stage{background:var(--ink);color:white;padding:23px 19px;border-radius:28px;text-align:center}.workout-stage .timer{font-size:74px;letter-spacing:-.08em;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:850;padding:16px 0}.workout-stage h2{font-size:24px;letter-spacing:-.045em;margin:7px 0}.workout-stage .phase-label{color:#c9e87e;font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:800}.track{height:9px;background:#40554d;border-radius:30px;overflow:hidden;margin:19px 0 10px}.track>div{height:100%;background:var(--accent);width:0%;transition:width .2s}.controls{display:flex;gap:9px;margin-top:12px}.controls .cta{flex:1}.controls .cta.secondary{color:#1f3b30}.subtle{color:#69796d}.rate-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.rate-row button{background:white;border:1.5px solid #dee7da;border-radius:12px;padding:14px 0;font-weight:900}.rate-row button.selected{background:#dff2b6;border-color:#8cae5e}.history-item{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}.history-item:last-child{border:0}.micro{margin:12px 0 0;font-size:11px;color:#849287}.flag{display:inline-block;background:#e5f1d2;border-radius:10px;padding:5px 9px;color:#38543f;font-size:12px;font-weight:800}.link-button{border:0;background:none;text-align:left;font:inherit;padding:0;color:inherit;text-decoration:underline;text-decoration-color:#c6d1ba;text-underline-offset:3px}.tagline{font-size:13px;color:#718377;margin-bottom:14px}.empty{padding:23px 15px;text-align:center;color:#819087;font-size:13px}.hide{display:none!important}@media(min-width:700px){.app{box-shadow:0 0 65px #162c2214}.bottom{box-shadow:0 -3px 18px #0000000a}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><div id="app" class="app"></div>
<script>
'use strict';
const STORE='svoy-temp-v01';
const defaults={profile:{age:55,weight:'',height:'',goal:'form',frequency:'3',experience:'new',bedtime:'23:00',gear12:true,gear16:true,ritual:false,ritualMins:'10',limitations:''},settings:{minutes:15,energy:'medium',period:'evening',ritualToday:false},history:[]};
function load(){try{const data=JSON.parse(localStorage.getItem(STORE)||'{}');return {profile:{...defaults.profile,...data.profile},settings:{...defaults.settings,...data.settings},history:Array.isArray(data.history)?data.history:[]}}catch(e){return JSON.parse(JSON.stringify(defaults))}}
const data=load();let view='today',detailId=null,preview=null,run=null,completed=null,rate=3;
const names={form:'Общая форма',weight:'Снижение жировой массы',muscle:'Сила и мышцы',cardio:'Выносливость'};
const ex={
 march:{name:'Шаги на месте',symbol:'🚶',tag:'Разминка',muscles:'Ноги, общий разогрев',how:'Иди на месте в удобном темпе, мягко ставь стопы. Дыши свободно.',mistake:'Не задерживай дыхание.',care:'При головокружении или боли прекрати занятие.',why:'Плавный переход от сидения к движению.'},
 shoulders:{name:'Круги плечами',symbol:'🔄',tag:'Разминка',muscles:'Плечевой пояс',how:'Небольшие комфортные круги плечами вперёд и назад. Без рывков.',mistake:'Не запрокидывай шею.',care:'При болезненных движениях уменьши амплитуду или пропусти.',why:'Мягко подготовить плечевой пояс.'},
 hinge:{name:'Отведение таза назад',symbol:'↔️',tag:'Техника',muscles:'Ягодицы, мышцы задней поверхности бедра',how:'Встань ровно, чуть согни колени и отведи таз назад, как будто закрываешь дверь ягодицами. Вернись в стойку. Без гири.',mistake:'Не округляй и не переразгибай спину.',care:'При боли в пояснице прекрати и не добавляй вес.',why:'Освоить базовый рисунок движения для работы с гирей.'},
 deadlift:{name:'Становая тяга с гирей',symbol:'🏋️',tag:'Гиря · база',muscles:'Ягодицы, задняя поверхность бедра, мышцы корпуса',how:'Поставь гирю между стоп. Отведи таз назад, немного согни колени, возьми рукоять. Встань, отталкиваясь стопами от пола. Опускай гирю контролируемо.',mistake:'Не тяни спиной с округлением и не ускоряй повторения ради таймера.',care:'При боли в спине, проблемах с равновесием или других ограничениях не выполняй без профессиональной оценки техники.',why:'Базовое силовое движение с акцентом на разгибание в тазобедренном суставе.'},
 squat:{name:'Присед с гирей у груди',symbol:'🦵',tag:'Гиря · база',muscles:'Бёдра, ягодицы, мышцы корпуса',how:'Держи гирю у груди двумя руками. Присядь на комфортную глубину, удерживая опору на всей стопе. Поднимись без рывка.',mistake:'Не заваливай колени внутрь и не теряй равновесие.',care:'При боли в коленях или спине выбери присед на стул без гири.',why:'Тренирует ноги и контроль положения корпуса.'},
 row:{name:'Тяга гири к поясу с опорой',symbol:'💪',tag:'Гиря · база',muscles:'Широчайшие мышцы спины, мышцы лопатки, руки',how:'Одной рукой обопрись на устойчивую поверхность. Другой рукой подтяни гирю к поясу без разворота корпуса, затем опусти. Смени сторону на следующем подходе.',mistake:'Не выкручивай корпус и не дёргай гирю.',care:'При боли в спине, плече или локте прекрати упражнение.',why:'Добавляет тяговое движение для верхней части тела.'},
 carry:{name:'Переноска гири у бедра',symbol:'🧳',tag:'Гиря · база',muscles:'Мышцы хвата, корпуса, стабилизаторы плеча',how:'Подними гирю безопасно, держи сбоку у бедра и медленно пройди по свободному пространству. Не заваливайся в сторону. Чередуй стороны.',mistake:'Не поднимай плечо к уху и не задерживай дыхание.',care:'Не выполняй при неустойчивом равновесии или без свободного места для ходьбы.',why:'Работа на устойчивость корпуса и хват.'},
 bridge:{name:'Ягодичный мост без гири',symbol:'🌉',tag:'Без гири',muscles:'Ягодицы, задняя поверхность бедра',how:'Ляг на спину, согни колени, стопы на полу. Плавно подними таз до комфортного положения и опусти.',mistake:'Не выгибай чрезмерно поясницу.',care:'Если движение вызывает боль в спине, прекрати.',why:'Лёгкое упражнение для ягодиц без дополнительного веса.'},
 chair:{name:'Присед на стул',symbol:'🪑',tag:'Без гири',muscles:'Бёдра, ягодицы',how:'Поставь устойчивый стул за собой. Сядь контролируемо и встань, опираясь на стопы. Двигайся в удобном темпе.',mistake:'Не падай на стул и не вскакивай рывком.',care:'При боли в коленях уменьшай глубину или откажись от упражнения.',why:'Доступный вариант движения для ног.'},
 breath:{name:'Спокойное дыхание',symbol:'🌿',tag:'Заминка',muscles:'Восстановление спокойного ритма',how:'Встань или сядь удобно. Дыши ровно, не заставляя себя делать слишком глубокие вдохи.',mistake:'Не задерживай дыхание и не форсируй выдох.',care:'При неприятных ощущениях вернись к обычному дыханию.',why:'Спокойное завершение занятия.'},
 slowmarch:{name:'Медленные шаги',symbol:'🚶',tag:'Заминка',muscles:'Ноги',how:'Медленно походи на месте, постепенно снижая темп.',mistake:'Не останавливайся резко после активных подходов.',care:'При плохом самочувствии присядь в безопасное положение.',why:'Плавное снижение активности.'},
 stretch:{name:'Мягкая подвижность',symbol:'🧘',tag:'Заминка',muscles:'Плечи, тазобедренные суставы',how:'Мягко подвигай плечами и тазом в комфортной амплитуде без усилия.',mistake:'Не тяни мышцы через боль.',care:'Не форсируй растяжку.',why:'Заканчиваем без дополнительных силовых усилий.'}
};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){console.warn('Storage disabled',e)}}
function periodBadge(){const h=+new Date().getHours();return h>=17?'Вечер':h<12?'Утро':'День'}
function bedtimeMin(){const [hh,mm]=String(data.profile.bedtime).split(':').map(Number);if(!Number.isFinite(hh))return null;let now=new Date(),n=now.getHours()*60+now.getMinutes(),b=hh*60+(mm||0);return ((b-n)+1440)%1440}
function makeWorkout(){
 const total=Number(data.settings.minutes),energy=data.settings.energy,level=data.profile.experience;
 let pool=energy==='low'?['chair','bridge','hinge']:level==='new'?['deadlift','chair','row']:data.profile.goal==='cardio'?['deadlift','carry','chair']:['deadlift','squat','row'];
 // Weight-bearing movements are not forced if user has marked a restriction.
 if(String(data.profile.limitations).trim()||(!data.profile.gear12&&!data.profile.gear16))pool=['chair','bridge','hinge'];
 let steps=[];const push=(id,secs,phase,round=0)=>steps.push({id,secs,phase,round});
 push('march',60,'Разминка');if(total>10)push('shoulders',60,'Разминка');push('hinge',60,'Разминка');
 const mainSeconds=(total*60)-(total>10?180:120)-(total>10?180:120);
 let n=mainSeconds/60;for(let i=0;i<n;i++){
  push(pool[i%3],40,'Основная часть',Math.floor(i/3)+1);
  push(null,20,'Отдых',Math.floor(i/3)+1);
 }
 push('slowmarch',60,'Заминка');if(total>10)push('stretch',60,'Заминка');push('breath',60,'Заминка');
 return {steps,total,energy,pool,name:energy==='low'?'Размяться без надрыва':energy==='high'?'Короткая силовая':'Немного силы после дня'};
}
function menu(){return `<nav class="bottom" aria-label="Разделы приложения">${[['today','⌂','Сегодня'],['week','▦','Неделя'],['library','▤','Упражнения'],['profile','♙','Профиль']].map(([id,i,label])=>`<button type="button" class="nav ${view===id?'active':''}" data-nav="${id}"><span class="i" aria-hidden="true">${i}</span>${label}</button>`).join('')}</nav>`}
function layout(inner,showNav=true){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="brand-icon"><img src="icon-192.png" alt="" width="29" height="29" style="border-radius:9px"></span> СВОЙ ТЕМП</div><small>прототип 0.1</small></header><main>${inner}</main>${showNav?menu():''}`}
const card=(title,content)=>`<section><div class="section-title"><h2>${title}</h2></div><div class="panel">${content}</div></section>`;
function today(){
 const s=data.settings;let w=preview||makeWorkout();const bedtime=bedtimeMin();const includeRitual=data.profile.ritual&&s.ritualToday;const ritualMin=Number(data.profile.ritualMins)||10;
 layout(`<div class="hero"><div class="eyebrow">Тренировка под твою жизнь</div><h1>Есть ${s.minutes} минут?<br>Этого достаточно,<br>чтобы начать.</h1><p>После работы, утром или когда появилось немного времени. Без гонки за рекордами.</p><div class="hero-bottom"><span class="pill accent">● Сегодня</span><span class="pill">${escapeHtml(names[data.profile.goal])}</span></div></div>
 ${card('Подобрать тренировку',`<div class="field-label">Сколько времени есть?</div><div class="button-row">${[10,15,20].map(n=>`<button class="chip ${s.minutes===n?'selected':''}" data-minutes="${n}">${n} мин</button>`).join('')}</div><div class="divider"></div><div class="field-label">Как себя чувствуешь?</div><div class="energy-row">${[['low','😮‍💨','Устал'],['medium','🙂','Нормально'],['high','⚡','Есть силы']].map(([id,e,t])=>`<button class="energy-card ${s.energy===id?'selected':''}" data-energy="${id}"><span class="emoji">${e}</span><strong>${t}</strong></button>`).join('')}</div><div class="divider"></div><div class="field-label">Когда заниматься?</div><div class="button-row" style="grid-template-columns:repeat(2,1fr)">${[['morning','☀️ Утром'],['evening','🌙 Вечером']].map(([v,l])=>`<button class="chip ${s.period===v?'selected':''}" data-period="${v}">${l}</button>`).join('')}</div>${data.profile.ritual?`<label class="checkline"><input id="ritualToday" type="checkbox" ${s.ritualToday?'checked':''}>Добавить мои «Пять тибетских жемчужин» (${ritualMin} мин) к общему времени</label>`:''}<div class="notice">Это демонстрационный подбор. Вес гири и безопасность техники не определяются по возрасту и времени автоматически.</div>`)}
 <section><div class="section-title"><h2>Подходящий вариант</h2><span>Предпросмотр</span></div><div class="preview"><div class="eyebrow">${s.period==='evening'?'Вечерний режим':'Утренний режим'}</div><h3>${w.name}</h3><div class="metrics"><div class="metric"><strong>${w.total}${includeRitual?' + '+ritualMin:''}</strong><span>минут всего${includeRitual?'*':''}</span></div><div class="metric"><strong>${s.energy==='low'?'Лёгкая':'Умеренная'}</strong><span>нагрузка</span></div><div class="metric"><strong>${w.pool.length}</strong><span>упражнения</span></div></div><div class="phase"><span>Разминка</span><strong>${w.total===10?2:3} мин</strong></div><div class="phase"><span>Основная часть с паузами</span><strong>${w.total===10?6:w.total===15?9:14} мин</strong></div><div class="phase"><span>Заминка</span><strong>${w.total===10?2:3} мин</strong></div><div class="muted" style="margin:12px 0">${w.pool.map(id=>ex[id].name).join(' · ')}.</div>${includeRitual?`<div class="muted">* Плюс ${ritualMin} минут на отдельную практику. Переход между комплексами не включён.</div>`:''}${s.period==='evening'&&bedtime!==null&&bedtime<180?`<div class="notice warn">До указанного времени сна менее 3 часов. Если интенсивная нагрузка мешает тебе засыпать, сократи комплекс или замени его прогулкой.</div>`:''}${(String(data.profile.limitations).trim()||(!data.profile.gear12&&!data.profile.gear16))?'<div class="notice warn">Показан демонстрационный комплекс без гири. При ограничениях по здоровью нужна индивидуальная оценка допустимой нагрузки.</div>':''}<button class="cta" style="margin-top:15px" data-action="start">▶ Начать тренировку</button><button class="text-btn" data-action="steps">Посмотреть упражнения и риски →</button></div></section>
 ${card('Маленькие шаги тоже считаются',`<div class="tagline">Стабильность важнее рекордов. В другие дни можно выбрать прогулку или велосипед. <a href="https://www.cdc.gov/physical-activity-basics/adding-adults/" target="_blank" rel="noopener">Общие рекомендации CDC ↗</a></div><div class="muted">Последняя активность: ${data.history.length?new Date(data.history[0].at).toLocaleDateString('ru-RU'):'пока нет записей'}.</div>`)}
 `)
}
function stepsPage(){const w=makeWorkout();const listed=[...new Set(w.steps.filter(s=>s.id).map(s=>s.id))];layout(`<button class="text-btn" data-nav="today">← К подбору</button><h1 class="screen-title">Внутри комплекса</h1><p class="tagline">${w.total} минут вместе с разминкой, отдыхом и заминкой. Нажми на любое упражнение.</p>${listed.map(id=>exerciseRow(id)).join('')}<div class="notice warn">Не начинай упражнение, если не владеешь его техникой или есть боль, головокружение, нестабильность либо медицинские ограничения. Для первой силовой программы полезна очная проверка техники.</div><button class="cta" style="margin-top:15px" data-action="start">▶ Начать тренировку</button>`,false)}
function exerciseRow(id){const e=ex[id];return `<button class="list-card" data-exercise="${id}"><span class="symbol">${e.symbol}</span><span><strong>${e.name}</strong><small>${e.tag} · ${e.muscles}</small></span><span class="arrow">›</span></button>`}
function library(){const all=['hinge','deadlift','squat','row','carry','chair','bridge','march','shoulders','slowmarch','stretch','breath'];layout(`<h1 class="screen-title">Библиотека</h1><p class="tagline">Простые объяснения для начинающих. Иллюстрации техники и видео будут добавлены после экспертной проверки движений.</p>${all.map(id=>exerciseRow(id)).join('')}<p class="micro">Состав библиотеки предварительный. Продвинутые движения с гирей намеренно не входят в первую версию.</p>`)}
function detail(){const e=ex[detailId];if(!e){view='library';return render()}layout(`<button class="text-btn" data-action="back-detail">← Назад</button><div class="illustration"><span>${e.symbol}</span><span class="sub">ИЛЛЮСТРАЦИЯ В РАЗРАБОТКЕ</span></div><span class="flag">${e.tag}</span><h1 class="screen-title" style="margin-top:15px">${e.name}</h1><div class="panel"><span class="info-key">Как выполнять</span><p class="info-text">${e.how}</p><span class="info-key">Какие мышцы работают</span><p class="info-text">${e.muscles}</p><span class="info-key">Типичная ошибка</span><p class="info-text">${e.mistake}</p><span class="info-key">Ограничения и риски</span><p class="info-text">${e.care}</p><span class="info-key">Зачем упражнение в программе</span><p class="info-text">${e.why}</p></div><div class="notice warn">Схематичная карточка не заменяет обучение технике. При боли, головокружении, давлении в груди или необычной одышке остановись и при необходимости обратись за медицинской помощью.</div>`,false)}
function week(){const d=Number(data.profile.frequency),todayDate=new Date().getDay();const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];const workoutDays=d===2?[1,4]:d===4?[1,2,4,6]:[1,3,6];const weekDays=[1,2,3,4,5,6,0];layout(`<h1 class="screen-title">Ритм недели</h1><p class="tagline">Это пример структуры недели, не жёсткий календарь. Короткая тренировка может заменить длинную без «долга» на завтра.</p><div class="panel"><div class="eyebrow">Цель</div><h2 style="margin:5px 0">${names[data.profile.goal]}</h2><span class="flag">${d} силовых дня в неделю</span></div><section><div class="section-title"><h2>Пример недели</h2><span>Вариант</span></div>${weekDays.map((n,i)=>{let wt=workoutDays.includes(n),bike=n===5;return `<div class="day ${todayDate===n?'today':''}"><div class="dow">${days[n]}</div><div><strong>${wt?'Гиря · базовый комплекс':bike?'Прогулка или велосипед':'Лёгкая активность / отдых'}</strong><small>${wt?'10–20 минут · техника и контроль нагрузки':bike?'В удобном темпе, по самочувствию':'При желании спокойная прогулка'}</small></div>${todayDate===n?'<span class="flag" style="margin-left:auto">Сегодня</span>':''}</div>`}).join('')}</section>${card('История',data.history.length?data.history.slice(0,10).map(s=>`<div class="history-item"><span>${new Date(s.at).toLocaleDateString('ru-RU')} · ${s.seconds!==undefined?fmt(s.seconds):s.minutes+' мин'} · ${s.mode==='low'?'лёгкая':'умеренная'}</span><strong>Самочувствие ${s.rate}/5</strong></div>`).join(''):'<div class="empty">После первой завершённой тренировки здесь появится запись.</div>')}`)}
function profile(){const p=data.profile;layout(`<h1 class="screen-title">Мой профиль</h1><p class="tagline">Данные сохраняются в этом браузере. Не отправляются на сервер.</p><div class="panel"><div class="twocol"><div class="formrow"><label for="age">Возраст, лет</label><input id="age" type="number" min="18" max="100" data-profile="age" value="${escapeHtml(p.age)}"></div><div class="formrow"><label for="weight">Вес, кг</label><input id="weight" type="number" min="1" max="400" step="0.1" placeholder="Необязательно" data-profile="weight" value="${escapeHtml(p.weight)}"></div></div><div class="twocol"><div class="formrow"><label for="height">Рост, см</label><input id="height" type="number" min="70" max="250" placeholder="Необязательно" data-profile="height" value="${escapeHtml(p.height)}"></div><div class="formrow"><label for="bedtime">Обычно ложусь</label><input id="bedtime" type="time" data-profile="bedtime" value="${escapeHtml(p.bedtime)}"></div></div><div class="formrow"><label for="goal">Основная цель</label><select id="goal" data-profile="goal">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${p.goal===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="twocol"><div class="formrow"><label for="frequency">Тренировок в неделю</label><select id="frequency" data-profile="frequency">${[2,3,4].map(n=>`<option ${p.frequency===String(n)?'selected':''} value="${n}">${n}</option>`).join('')}</select></div><div class="formrow"><label for="experience">Опыт с гирей</label><select id="experience" data-profile="experience"><option value="new" ${p.experience==='new'?'selected':''}>Начинающий</option><option value="experienced" ${p.experience==='experienced'?'selected':''}>Есть опыт</option></select></div></div><div class="divider"></div><div class="field-label">Доступные гири</div><label class="checkline"><input type="checkbox" data-profile="gear12" ${p.gear12?'checked':''}>12 кг</label><label class="checkline"><input type="checkbox" data-profile="gear16" ${p.gear16?'checked':''}>16 кг</label><div class="notice">Вес гири не назначается автоматически. Используй только вес, с которым ты уверенно владеешь техникой; при сомнениях делай вариант без отягощения.</div><div class="divider"></div><label class="checkline"><input type="checkbox" data-profile="ritual" ${p.ritual?'checked':''}>Практикую «Пять тибетских жемчужин» отдельно</label><div class="formrow"><label for="ritualMins">Время этой практики</label><select id="ritualMins" data-profile="ritualMins">${[5,10,15,20].map(n=>`<option value="${n}" ${p.ritualMins===String(n)?'selected':''}>${n} минут</option>`).join('')}</select></div><div class="formrow"><label for="limitations">Ограничения по здоровью / боли</label><textarea id="limitations" rows="3" data-profile="limitations" placeholder="Если есть, укажи кратко. Можно оставить пустым.">${escapeHtml(p.limitations)}</textarea></div><div class="notice warn">Прототип не оценивает медицинские противопоказания. При указанных ограничениях он переключает демонстрацию на упражнения без гири, но это не означает, что они разрешены конкретному человеку.</div><button class="cta" data-action="save-profile">Сохранить профиль</button><p class="micro">В этой версии профиль и история хранятся только в браузере устройства. Очистка данных браузера их удалит.</p></div>`)}
function runPage(){const step=run.steps[run.idx],e=step.id?ex[step.id]:null;const name=e?e.name:'Отдых и дыхание';const overall=(run.steps.slice(0,run.idx).reduce((s,x)=>s+x.secs,0)+(step.secs-run.remaining))/(run.total*60)*100;layout(`<div class="workout-head"><div class="eyebrow">Занятие в процессе</div><h1 class="screen-title">Свой темп</h1><div class="muted">Шаг ${run.idx+1} из ${run.steps.length} · ${run.total} минут</div></div><div class="workout-stage"><div class="phase-label">${step.phase}</div><h2>${name}</h2><div id="time-left" class="timer" role="timer" aria-label="Оставшееся время">${fmt(run.remaining)}</div><div class="muted" style="color:#bed0c3">${step.id?'Двигайся спокойно, паузы разрешены':'Перед следующим упражнением восстанови дыхание'}</div><div class="track"><div id="work-progress" style="width:${overall.toFixed(2)}%"></div></div><small id="overall-left">Всего осталось ${fmt(run.steps.slice(run.idx+1).reduce((s,x)=>s+x.secs,run.remaining))}</small></div><div class="controls"><button class="cta secondary" data-action="toggle">${run.running?'Ⅱ Пауза':'▶ Продолжить'}</button><button class="cta dark" data-action="skip">Дальше →</button></div><div style="text-align:center"><button class="text-btn" data-action="stop">Завершить досрочно</button></div><div class="panel" style="margin-top:14px"><h3 style="margin:0 0 8px">${e?'Подсказка':'Отдых'}</h3><p style="font-size:14px;margin:0">${e?e.how:'Не торопись. Если нужна более длинная пауза, поставь тренировку на паузу.'}</p>${e?`<button class="text-btn" data-exercise="${step.id}">Мышцы, ограничения и ошибки →</button>`:''}</div><div class="notice warn">Если возникла боль, головокружение, давление в груди или необычная одышка, прекрати тренировку.</div>`,false)}
function donePage(){layout(`<div class="hero"><div class="eyebrow">Занятие завершено</div><h1>${completed.early?'Ты остановился вовремя.':'Готово. Маленькое дело сделано.'}</h1><p>Запись сохраняется только после нажатия кнопки ниже. Даже короткая активность имеет значение.</p></div><section><div class="panel"><div class="field-label">Как далась нагрузка? (1 = очень легко, 5 = слишком тяжело)</div><div class="rate-row">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="${rate===n?'selected':''}">${n}</button>`).join('')}</div><button class="cta" data-action="record">Сохранить в историю</button><button class="text-btn" data-action="discard">Без сохранения</button></div></section>`,false)}
function render(){preview=makeWorkout();if(view==='today')today();else if(view==='week')week();else if(view==='library')library();else if(view==='profile')profile();else if(view==='detail')detail();else if(view==='steps')stepsPage();else if(view==='run')runPage();else if(view==='done')donePage()}
function go(v){view=v;render();window.scrollTo(0,0)}
function begin(){const w=makeWorkout();run={...w,idx:0,remaining:w.steps[0].secs,running:true,last:Date.now(),started:Date.now(),activeSeconds:0};go('run')}
function nextStep(){run.idx++;if(run.idx>=run.steps.length){complete(false);return}run.remaining=run.steps[run.idx].secs;render()}
function complete(early){const elapsed=early?Math.round(run.activeSeconds):run.total*60;completed={seconds:elapsed,minutes:Math.round(elapsed/60),mode:run.energy,early:!!early};run=null;rate=3;go('done')}
function tick(){if(view!=='run'||!run||!run.running)return;const now=Date.now(),sec=(now-run.last)/1000;run.last=now;run.activeSeconds+=sec;run.remaining-=sec;if(run.remaining<=0){let left=-run.remaining;do{run.idx++;if(run.idx>=run.steps.length){complete(false);return}run.remaining=run.steps[run.idx].secs-left;left=-run.remaining}while(run.remaining<=0);render()}else{const step=run.steps[run.idx],end=run.steps.slice(run.idx+1).reduce((s,x)=>s+x.secs,run.remaining);const pct=100*(run.steps.slice(0,run.idx).reduce((s,x)=>s+x.secs,0)+(step.secs-run.remaining))/(run.total*60);const t=document.getElementById('time-left');if(t)t.textContent=fmt(run.remaining);const p=document.getElementById('work-progress');if(p)p.style.width=Math.min(100,pct)+'%';const o=document.getElementById('overall-left');if(o)o.textContent='Всего осталось '+fmt(end)}}
setInterval(tick,200);
document.addEventListener('click',event=>{
 const btn=event.target.closest('button');if(!btn)return;
 if(btn.dataset.nav){go(btn.dataset.nav);return}
 if(btn.dataset.minutes){data.settings.minutes=+btn.dataset.minutes;save();render();return}
 if(btn.dataset.energy){data.settings.energy=btn.dataset.energy;save();render();return}
 if(btn.dataset.period){data.settings.period=btn.dataset.period;save();render();return}
 if(btn.dataset.exercise){if(view==='run'&&run){run.running=false;run.last=Date.now()}detailId=btn.dataset.exercise;window.__detailFrom=view;go('detail');return}
 if(btn.dataset.rate){rate=+btn.dataset.rate;render();return}
 const a=btn.dataset.action;if(!a)return;
 if(a==='steps')go('steps');
 if(a==='start')begin();
 if(a==='back-detail')go(window.__detailFrom||'library');
 if(a==='toggle'){run.running=!run.running;run.last=Date.now();render()}
 if(a==='skip'){run.last=Date.now();nextStep()}
 if(a==='stop'){if(confirm('Завершить тренировку сейчас?'))complete(true)}
 if(a==='record'){data.history.unshift({...completed,rate,at:new Date().toISOString()});save();completed=null;go('week')}
 if(a==='discard'){completed=null;go('today')}
 if(a==='save-profile'){const lim=String(data.profile.limitations).trim();if(lim&&String(data.profile.experience)!=='new')alert('Ограничения указаны. Демонстрационная программа не подбирает медицински допустимую нагрузку.');save();alert('Профиль сохранён на этом устройстве.');go('today')}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='ritualToday'){data.settings.ritualToday=el.checked;save();render();return}
 if(!el.dataset.profile)return;
 const key=el.dataset.profile;data.profile[key]=el.type==='checkbox'?el.checked:el.value;
 if(key==='age')data.profile.age=Math.max(18,Math.min(100,Number(el.value)||18));
 save(); // Don't reset a text field mid-entry; non-text changes may re-render safely.
 if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='time')render();
});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
